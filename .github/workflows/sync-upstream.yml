name: Sync from Upstream

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout our repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/Maciek-roboblog/Claude-Code-Usage-Monitor.git || true
          git fetch upstream

      - name: Check for upstream changes
        id: check
        run: |
          # Get latest commit from upstream main branch
          UPSTREAM_COMMIT=$(git rev-parse upstream/main)
          LAST_SYNC_COMMIT=$(git log --grep="Sync from upstream" -1 --format=%H || echo "none")

          echo "upstream_commit=$UPSTREAM_COMMIT" >> $GITHUB_OUTPUT
          echo "last_sync=$LAST_SYNC_COMMIT" >> $GITHUB_OUTPUT

          # Check if there are new commits
          if [ "$UPSTREAM_COMMIT" != "$LAST_SYNC_COMMIT" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create sync branch
        if: steps.check.outputs.has_changes == 'true'
        run: |
          DATE=$(date +%Y%m%d)
          BRANCH_NAME="sync/upstream-$DATE"
          git checkout -b $BRANCH_NAME
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Merge upstream changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          # Try to merge upstream changes into our src/claude_monitor directory
          git merge upstream/main --no-commit --no-ff || true

          # If there are conflicts, create a report
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "CONFLICTS DETECTED" > sync-report.txt
            git diff --name-only --diff-filter=U >> sync-report.txt
            git add .
          else
            git add src/claude_monitor
          fi

      - name: Commit changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync from upstream: $(date +%Y-%m-%d)

Upstream commit: ${{ steps.check.outputs.upstream_commit }}
Auto-synced by GitHub Actions

Check sync-report.txt if conflicts exist." || true

      - name: Push changes
        if: steps.check.outputs.has_changes == 'true'
        run: |
          git push origin ${{ env.branch_name }}

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.branch_name }}
          title: "🔄 Sync from upstream: $(date +%Y-%m-%d)"
          body: |
            ## Upstream Sync

            This PR contains changes from the original Claude-Code-Usage-Monitor repository.

            **Upstream commit:** ${{ steps.check.outputs.upstream_commit }}
            **Sync date:** $(date +%Y-%m-%d)

            ### Review Checklist
            - [ ] Check for conflicts in `sync-report.txt`
            - [ ] Test that original features still work
            - [ ] Test that Observatory features still work
            - [ ] Update docs/CHANGELOG.md with upstream changes
            - [ ] Run tests: `pytest src/tests`

            ### Original Repo
            https://github.com/Maciek-roboblog/Claude-Code-Usage-Monitor

            ---
            🤖 Auto-generated by GitHub Actions
          labels: upstream-sync, automated